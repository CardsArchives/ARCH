<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARCH — Discord Activity</title>
<style>
:root {
  --g0: #000000;
  --g1: #001a00;
  --g2: #003300;
  --green: #00ff41;
  --green2: #00cc33;
  --green3: #008f11;
  --green4: #003b00;
  --dim: #00ff4133;
  --text: #00ff41;
  --red: #ff003c;
  --gold: #ffe066;
  --white: #e0ffe0;
  --font: 'Courier New', Courier, monospace;
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  height: 100%;
  background: var(--g0);
  color: var(--green);
  font-family: var(--font);
  overflow: hidden;
  user-select: none;
}

body {
  display: flex;
  flex-direction: column;
  position: relative;
}

#matrixCanvas { position: fixed; top: 0; left: 0; z-index: 0; opacity: 0.15; pointer-events: none; }

/* LOADING SCREEN */
#loadScreen {
  position: fixed;
  inset: 0;
  background: var(--g0);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  z-index: 999;
}

#loadScreen h1 {
  font-size: 2.8rem;
  letter-spacing: 14px;
  color: var(--green);
  text-shadow: 0 0 28px var(--green);
  animation: glitch 2.5s infinite;
}

@keyframes glitch {
  0%,100% { text-shadow: 0 0 28px var(--green); }
  93% { text-shadow: -2px 0 var(--red), 2px 0 #00f; }
  95% { text-shadow: 2px 0 var(--red), -2px 0 #00f; }
  97% { text-shadow: 0 0 28px var(--green); }
}

.load-bar {
  width: 180px;
  height: 2px;
  background: var(--green4);
}

.load-fill {
  height: 100%;
  background: var(--green);
  width: 0%;
  transition: width 0.3s;
  box-shadow: 0 0 6px var(--green);
}

.load-txt {
  font-size: 0.52rem;
  letter-spacing: 4px;
  color: var(--green3);
}

/* APP */
#app {
  position: relative;
  z-index: 1;
  display: none;
  flex-direction: column;
  height: 100vh;
  width: 100%;
}

#app.show {
  display: flex;
}

/* HEADER */
#header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 6px 14px;
  border-bottom: 1px solid var(--green4);
  background: rgba(0, 8, 0, 0.96);
  flex-shrink: 0;
}

#header h1 {
  font-size: 1.1rem;
  letter-spacing: 7px;
  text-shadow: 0 0 10px var(--green);
}

.bal-chip {
  display: flex;
  align-items: center;
  gap: 5px;
  border: 1px solid var(--green3);
  padding: 3px 9px;
  font-size: 0.55rem;
  letter-spacing: 1px;
}

.bal-val {
  color: var(--gold);
  font-size: 0.7rem;
  font-weight: bold;
}

/* BODY */
#body {
  flex: 1;
  display: flex;
  overflow: hidden;
}

/* CONTENT */
#content {
  flex: 1;
  padding: 14px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

/* SECTIONS */
.section-title {
  font-size: 0.48rem;
  letter-spacing: 4px;
  color: var(--green3);
  margin-bottom: 8px;
}

/* STATUS */
#status {
  padding: 8px 12px;
  border: 1px solid var(--green3);
  font-size: 0.5rem;
  color: var(--green3);
}

#status.connected {
  border-color: var(--green);
  color: var(--green);
}

/* BUTTONS */
.btn {
  background: transparent;
  border: 1px solid var(--green);
  color: var(--green);
  font-family: var(--font);
  font-size: 0.55rem;
  letter-spacing: 3px;
  padding: 7px 16px;
  cursor: pointer;
  transition: all 0.2s;
}

.btn:hover:not(:disabled) {
  background: rgba(0, 255, 65, 0.07);
  box-shadow: 0 0 10px #00ff4125;
}

.btn:disabled {
  opacity: 0.35;
  cursor: default;
}

/* SCANLINE */
body::after {
  content: '';
  position: fixed;
  inset: 0;
  background: repeating-linear-gradient(
    to bottom,
    transparent 0px,
    transparent 2px,
    rgba(0, 0, 0, 0.12) 2px,
    rgba(0, 0, 0, 0.12) 4px
  );
  pointer-events: none;
  z-index: 2;
}

/* SCROLLBAR */
::-webkit-scrollbar {
  width: 6px;
}

::-webkit-scrollbar-track {
  background: var(--green4);
}

::-webkit-scrollbar-thumb {
  background: var(--green3);
  border-radius: 3px;
}

::-webkit-scrollbar-thumb:hover {
  background: var(--green2);
}
</style>
</head>
<body>

<canvas id="matrixCanvas"></canvas>

<!-- LOADING -->
<div id="loadScreen">
  <h1>ARCH</h1>
  <div class="load-bar">
    <div class="load-fill" id="lf"></div>
  </div>
  <div class="load-txt" id="lt">Initialisation...</div>
</div>

<!-- APP -->
<div id="app">
  <div id="header">
    <h1>ARCH ACTIVITY</h1>
    <div class="bal-chip">◈ <span class="bal-val" id="balDisp">0.000000</span> ARCH</div>
  </div>
  <div id="body">
    <div id="content">
      <div id="status">⏳ Connexion...</div>
      <button class="btn" id="testBtn" disabled>Attente...</button>
    </div>
  </div>
</div>

<script type="module">
import { DiscordSDK } from 'https://cdn.jsdelivr.net/npm/@discord/embedded-app-sdk@1.3.0/+esm';

// ============================================================
//  CONFIG
// ============================================================
const CLIENT_ID = '__DISCORD_CLIENT_ID__';
const SERVER_URL = '__SERVER_URL__';

console.log('🔍 CLIENT_ID:', CLIENT_ID);
console.log('🔍 SERVER_URL:', SERVER_URL);

// Déterminer l'URL du serveur
let serverUrl = SERVER_URL;
if (!serverUrl || serverUrl === '__SERVER_URL__') {
  serverUrl = location.origin;
  console.log('⚠️ SERVER_URL pas injecté, utilisant location.origin:', serverUrl);
} else {
  console.log('✅ SERVER_URL injecté:', serverUrl);
}

// ============================================================
//  STATE
// ============================================================
let myUser = null;
let token = null;
let balance = 0;
let ws = null;

const discordSdk = new DiscordSDK(CLIENT_ID);

// Initialiser Discord SDK avec gestion des erreurs
discordSdk.close = () => {};  // Prevent auto-close

// ============================================================
//  UTILITIES
// ============================================================
function setLoad(p, t) {
  document.getElementById('lf').style.width = p + '%';
  document.getElementById('lt').textContent = t;
}

function showApp() {
  document.getElementById('loadScreen').style.display = 'none';
  document.getElementById('app').classList.add('show');
  startMatrix();
}

function updateStatus(msg, connected = false) {
  const el = document.getElementById('status');
  el.textContent = msg;
  if (connected) {
    el.classList.add('connected');
  } else {
    el.classList.remove('connected');
  }
}

function updateBalance() {
  document.getElementById('balDisp').textContent = balance.toFixed(6);
}

// ============================================================
//  MATRIX RAIN
// ============================================================
function startMatrix() {
  const canvas = document.getElementById('matrixCanvas');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const chars = 'アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン';
  const charArray = chars.split('');
  const fontSize = 10;
  const columns = Math.floor(canvas.width / fontSize);
  const drops = Array(columns).fill(1);

  function draw() {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#00ff41';
    ctx.font = fontSize + 'px monospace';

    for (let i = 0; i < drops.length; i++) {
      const text = charArray[Math.floor(Math.random() * charArray.length)];
      ctx.fillText(text, i * fontSize, drops[i] * fontSize);
      if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
        drops[i] = 0;
      }
      drops[i]++;
    }
  }

  setInterval(draw, 100);
}

// ============================================================
//  DISCORD AUTH
// ============================================================
async function init() {
  try {
    setLoad(10, 'SDK DISCORD...');
    console.log('Initialisation SDK Discord...');
    
    try {
      await discordSdk.ready();
      console.log('✅ SDK prêt');
    } catch(e) {
      console.warn('⚠️ SDK ready error (normal en dev):', e.message);
      // Continuer même si y'a une erreur, ça arrive en développement
    }

    setLoad(25, 'AUTORISATION...');
    let code = null;
    
    try {
      const auth = await discordSdk.commands.authorize({
        client_id: CLIENT_ID,
        response_type: 'code',
        state: '',
        prompt: 'none',
        scope: ['identify'],
      });
      code = auth.code;
      console.log('✅ Authorization code reçu');
    } catch(e) {
      console.error('❌ Auth error:', e.message);
      throw new Error('Impossible d\'autoriser: ' + e.message);
    }

    if (!code) throw new Error('Pas de code reçu');

    setLoad(45, 'TOKEN...');
    const tr = await fetch(serverUrl + '/api/discord/token', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code }),
    });
    const tokenData = await tr.json();
    if (!tokenData.access_token) throw new Error('Pas d\'access token');
    const access_token = tokenData.access_token;
    console.log('✅ Access token reçu');

    setLoad(60, 'PROFIL...');
    const auth = await discordSdk.commands.authenticate({ access_token });
    myUser = auth.user;
    console.log('✅ Profil Discord:', myUser.username);

    setLoad(75, 'COMPTE ARCH...');
    const ar = await fetch(serverUrl + '/api/discord/auth', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ 
        discord_id: myUser.id, 
        username: myUser.username, 
        avatar: myUser.avatar 
      }),
    });
    const ad = await ar.json();
    if (!ad.token) throw new Error('Auth ARCH échouée: ' + JSON.stringify(ad));
    token = ad.token;
    balance = ad.balance || 0;
    console.log('✅ Compte ARCH créé/connecté');

    setLoad(90, 'WEBSOCKET...');
    await connectWS();

    setLoad(100, 'PRÊT !');
    updateBalance();
    updateStatus('✅ Connecté !', true);
    document.getElementById('testBtn').disabled = false;
    document.getElementById('testBtn').textContent = 'PRÊT';

    setTimeout(showApp, 350);

  } catch(e) {
    console.error('❌ Erreur init:', e);
    setLoad(0, '⚠ ' + e.message);
    updateStatus('❌ Erreur: ' + e.message);
  }
}

// ============================================================
//  WEBSOCKET
// ============================================================
async function connectWS() {
  return new Promise(resolve => {
    let wsUrl = serverUrl;

    // S'assurer que wsUrl commence par http:// ou https://
    if (!wsUrl.startsWith('http')) {
      wsUrl = location.protocol + '//' + wsUrl;
    }

    // Convertir http en ws, https en wss
    wsUrl = wsUrl.replace(/^http:/, 'ws:').replace(/^https:/, 'wss:');

    // Ajouter le chemin WebSocket
    wsUrl = wsUrl + '/ws?token=' + token;

    console.log('🔌 Tentative connexion WebSocket:', wsUrl);

    ws = new WebSocket(wsUrl);

    ws.onopen = () => {
      console.log('✅ WebSocket connecté');
      resolve();
    };

    ws.onerror = (err) => {
      console.error('❌ WebSocket erreur:', err);
      resolve();
    };

    ws.onmessage = (e) => {
      try {
        const msg = JSON.parse(e.data);
        console.log('📨 Message WS:', msg.type);
        if (msg.type === 'balance_sync') {
          balance = msg.balance;
          updateBalance();
        }
      } catch(e) {
        console.error('Erreur parse WS:', e);
      }
    };

    ws.onclose = () => {
      console.log('⚠️ WebSocket fermé');
      updateStatus('⚠️ WebSocket fermé, reconnexion...', false);
      setTimeout(connectWS, 3000);
    };

    setTimeout(resolve, 2500);
  });
}

// ============================================================
//  STARTUP
// ============================================================
init();

// Test button
document.getElementById('testBtn').addEventListener('click', () => {
  if (ws && ws.readyState === WebSocket.OPEN) {
    console.log('📤 Envoi test message...');
    ws.send(JSON.stringify({
      type: 'status',
      status: 'playing'
    }));
  }
});
</script>
</body>
</html>
