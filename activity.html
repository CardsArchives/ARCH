<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARCH Activity</title>
<style>
:root {
  --green: #00ff41;
  --green3: #008f11;
  --green4: #003b00;
  --red: #ff003c;
  --gold: #ffe066;
  --font: 'Courier New', Courier, monospace;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  height: 100%;
  background: #000;
  color: var(--green);
  font-family: var(--font);
  overflow: hidden;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

#app {
  text-align: center;
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 20px;
  padding: 20px;
}

h1 {
  font-size: 3rem;
  letter-spacing: 10px;
  text-shadow: 0 0 20px var(--green);
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.6; }
}

.status {
  font-size: 1rem;
  letter-spacing: 2px;
  color: var(--green3);
  min-height: 30px;
}

.status.loading {
  color: var(--green);
}

.status.error {
  color: var(--red);
}

.status.success {
  color: var(--gold);
}

.balance {
  font-size: 1.2rem;
  color: var(--gold);
  border: 1px solid var(--green3);
  padding: 10px 20px;
  border-radius: 4px;
  min-width: 200px;
}

.button {
  background: transparent;
  border: 1px solid var(--green);
  color: var(--green);
  font-family: var(--font);
  font-size: 0.9rem;
  padding: 10px 20px;
  cursor: pointer;
  transition: all 0.2s;
}

.button:hover:not(:disabled) {
  background: rgba(0, 255, 65, 0.1);
  box-shadow: 0 0 10px var(--green);
}

.button:disabled {
  opacity: 0.3;
  cursor: default;
}

.info {
  font-size: 0.8rem;
  color: var(--green3);
  max-width: 400px;
  line-height: 1.5;
}
</style>
</head>
<body>

<div id="app">
  <h1>ARCH</h1>
  <div class="status loading" id="status">⏳ Initialisation...</div>
  <div class="balance" id="balance">◈ 0.000000 ARCH</div>
  <button class="button" id="testBtn" disabled>Test</button>
  <div class="info" id="info"></div>
</div>

<script async src="https://cdn.jsdelivr.net/npm/@discord/embedded-app-sdk@1.3.0"></script>

<script>
// ============================================================
//  CONFIG
// ============================================================
const CLIENT_ID = '__DISCORD_CLIENT_ID__';
const SERVER_URL = '__SERVER_URL__';

console.log('🔍 CLIENT_ID:', CLIENT_ID);
console.log('🔍 SERVER_URL:', SERVER_URL);

// Déterminer l'URL du serveur
let serverUrl = SERVER_URL;
if (!serverUrl || serverUrl === '__SERVER_URL__') {
  serverUrl = location.origin;
  console.log('⚠️ SERVER_URL pas injecté, utilisant location.origin:', serverUrl);
} else {
  console.log('✅ SERVER_URL injecté:', serverUrl);
}

// ============================================================
//  STATE
// ============================================================
let myUser = null;
let token = null;
let balance = 0;
let ws = null;

// ============================================================
//  UTILS
// ============================================================
function setStatus(msg, type = 'loading') {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = 'status ' + type;
}

function setBalance(val) {
  balance = val;
  document.getElementById('balance').textContent = '◈ ' + val.toFixed(6) + ' ARCH';
}

function setInfo(msg) {
  document.getElementById('info').textContent = msg;
}

// ============================================================
//  DISCORD SDK
// ============================================================
async function initDiscordSDK() {
  try {
    // Attendre que le SDK soit chargé
    if (!window.DiscordSDK) {
      console.log('⏳ En attente du SDK Discord...');
      await new Promise(resolve => {
        const checkSDK = setInterval(() => {
          if (window.DiscordSDK) {
            clearInterval(checkSDK);
            resolve();
          }
        }, 100);
        setTimeout(() => { clearInterval(checkSDK); resolve(); }, 5000);
      });
    }

    if (!window.DiscordSDK) {
      throw new Error('Discord SDK not loaded');
    }

    const discordSdk = new window.DiscordSDK(CLIENT_ID);
    console.log('✅ SDK Discord initialisé');

    // Ready
    await discordSdk.ready();
    console.log('✅ SDK prêt');

    // Authorize
    const { code } = await discordSdk.commands.authorize({
      client_id: CLIENT_ID,
      response_type: 'code',
      state: '',
      prompt: 'none',
      scope: ['identify'],
    });
    console.log('✅ Code d\'autorisation reçu');

    // Token exchange
    const tr = await fetch(serverUrl + '/api/discord/token', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code }),
    });
    const { access_token } = await tr.json();
    console.log('✅ Access token reçu');

    // Authenticate
    const auth = await discordSdk.commands.authenticate({ access_token });
    myUser = auth.user;
    console.log('✅ Profil Discord:', myUser.username);

    return true;
  } catch(e) {
    console.error('❌ Erreur Discord SDK:', e.message);
    return false;
  }
}

// ============================================================
//  CREATE ARCH ACCOUNT
// ============================================================
async function createArchAccount() {
  try {
    const ar = await fetch(serverUrl + '/api/discord/auth', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        discord_id: myUser.id,
        username: myUser.username,
        avatar: myUser.avatar
      }),
    });
    
    const ad = await ar.json();
    if (!ad.token) throw new Error('Compte non créé');
    
    token = ad.token;
    balance = ad.balance || 0;
    console.log('✅ Compte ARCH:', ad.username);
    
    return true;
  } catch(e) {
    console.error('❌ Erreur création compte:', e.message);
    return false;
  }
}

// ============================================================
//  WEBSOCKET
// ============================================================
async function connectWS() {
  return new Promise((resolve) => {
    let wsUrl = serverUrl;
    
    if (!wsUrl.startsWith('http')) {
      wsUrl = location.protocol + '//' + wsUrl;
    }
    
    wsUrl = wsUrl.replace(/^http:/, 'ws:').replace(/^https:/, 'wss:');
    wsUrl = wsUrl + '/ws?token=' + token;
    
    console.log('🔌 WebSocket URL:', wsUrl);
    
    ws = new WebSocket(wsUrl);
    
    ws.onopen = () => {
      console.log('✅ WebSocket connecté');
      resolve();
    };
    
    ws.onerror = (err) => {
      console.error('❌ WebSocket erreur:', err);
      resolve();
    };
    
    ws.onmessage = (e) => {
      try {
        const msg = JSON.parse(e.data);
        if (msg.type === 'balance_sync') {
          setBalance(msg.balance);
        }
      } catch(e) {
        console.error('Erreur parse:', e);
      }
    };
    
    ws.onclose = () => {
      console.log('⚠️ WebSocket fermé');
      setTimeout(connectWS, 3000);
    };
    
    setTimeout(resolve, 2000);
  });
}

// ============================================================
//  MAIN
// ============================================================
async function init() {
  try {
    setStatus('🔐 Authentification Discord...', 'loading');
    const discordOk = await initDiscordSDK();
    
    if (!discordOk) {
      throw new Error('Discord SDK failed');
    }

    setStatus('📝 Création compte ARCH...', 'loading');
    const archOk = await createArchAccount();
    
    if (!archOk) {
      throw new Error('Account creation failed');
    }

    setStatus('🔌 Connexion WebSocket...', 'loading');
    await connectWS();

    setStatus('✅ Connecté!', 'success');
    setBalance(balance);
    setInfo('Discord Activity connectée!');
    document.getElementById('testBtn').disabled = false;

  } catch(e) {
    console.error('❌ Erreur:', e);
    setStatus('❌ Erreur: ' + e.message, 'error');
    setInfo(e.message);
  }
}

// Démarrer après que la page soit chargée
window.addEventListener('load', init);

// Test button
document.getElementById('testBtn').addEventListener('click', () => {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'status', status: 'playing' }));
    setInfo('Message envoyé');
  }
});
</script>
</body>
</html>
