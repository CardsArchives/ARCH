<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ARCH</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; background: #000; overflow: hidden; font-family: 'Courier New', monospace; color: #00ff41; }
#boot { position: fixed; inset: 0; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; gap: 18px; }
.boot-logo { font-size: clamp(2rem, 10vw, 3.5rem); font-weight: 900; letter-spacing: 14px; text-shadow: 0 0 10px #00ff41, 0 0 30px #00ff41; animation: pulse 2s ease-in-out infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.7} }
.boot-status { font-size: 0.62rem; letter-spacing: 4px; color: #008f11; min-height: 1.2em; text-align: center; word-break: break-all; max-width: 90vw; }
.boot-bar-wrap { width: min(260px, 80vw); height: 2px; background: #003b00; }
.boot-bar { height: 100%; background: #00ff41; width: 0%; transition: width 0.4s ease; }
.boot-err { font-size: 0.55rem; color: #ff003c; letter-spacing: 1px; text-align: center; display: none; max-width: 94vw; line-height: 1.8; padding: 0 10px; word-break: break-all; }
.boot-info { font-size: 0.48rem; color: #003b00; text-align: center; max-width: 94vw; word-break: break-all; padding: 0 10px; }
</style>
</head>
<body>
<div id="boot">
  <div class="boot-logo">ARCH</div>
  <div class="boot-bar-wrap"><div class="boot-bar" id="bootBar"></div></div>
  <div class="boot-status" id="bootStatus">LECTURE URL...</div>
  <div class="boot-info" id="bootInfo"></div>
  <div class="boot-err" id="bootErr"></div>
</div>

<script type="module">
const statusEl = document.getElementById('bootStatus');
const barEl    = document.getElementById('bootBar');
const errEl    = document.getElementById('bootErr');
const infoEl   = document.getElementById('bootInfo');

// Affiche TOUT ce qu'on reçoit pour diagnostiquer
infoEl.textContent = 'href: ' + window.location.href
  + ' | search: ' + window.location.search
  + ' | hash: ' + window.location.hash;

function showError(msg) {
  errEl.innerHTML = String(msg).replace(/\n/g, '<br>');
  errEl.style.display = 'block';
  statusEl.textContent = 'ERREUR';
  barEl.style.background = '#ff003c';
}

try {
  statusEl.textContent = 'IMPORT SDK...';
  const { DiscordSDK, patchUrlMappings } = await import('https://cdn.jsdelivr.net/npm/@discord/embedded-app-sdk@1.3.0/output/index.mjs');
  statusEl.textContent = 'SDK CHARGE';
  barEl.style.width = '30%';

  // Log toutes les params
  const raw = window.location.search || window.location.hash.replace(/^#\??/, '?');
  const params = new URLSearchParams(raw.startsWith('?') ? raw.slice(1) : raw);
  const frameId    = params.get('frame_id')    || undefined;
  const instanceId = params.get('instance_id') || undefined;

  infoEl.textContent += ' | frame_id: ' + frameId + ' | instance_id: ' + instanceId;

  statusEl.textContent = 'NEW SDK...';
  const sdk = new DiscordSDK('__DISCORD_CLIENT_ID__', { frameId, instanceId });

  statusEl.textContent = 'READY...';
  barEl.style.width = '50%';
  await sdk.ready();

  statusEl.textContent = 'SDK OK !';
  barEl.style.width = '70%';
  barEl.style.background = '#00ff41';

} catch(err) {
  console.error(err);
  showError(err?.message || JSON.stringify(err));
}
</script>
</body>
</html>
