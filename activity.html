<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARCH Activity</title>
<style>
:root {
  --green: #00ff41;
  --green3: #008f11;
  --green4: #003b00;
  --red: #ff003c;
  --gold: #ffe066;
  --font: 'Courier New', Courier, monospace;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  height: 100%;
  background: #000;
  color: var(--green);
  font-family: var(--font);
  overflow: hidden;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 20px;
  padding: 20px;
}

h1 {
  font-size: 3rem;
  letter-spacing: 10px;
  text-shadow: 0 0 20px var(--green);
}

.box {
  border: 1px solid var(--green3);
  padding: 15px 30px;
  text-align: center;
  min-width: 300px;
}

.status {
  font-size: 1.1rem;
  color: var(--green);
  font-weight: bold;
}

.balance {
  font-size: 1.3rem;
  color: var(--gold);
  font-weight: bold;
}

.button {
  background: transparent;
  border: 1px solid var(--green);
  color: var(--green);
  font-family: var(--font);
  font-size: 0.9rem;
  padding: 10px 25px;
  cursor: pointer;
  margin-top: 10px;
}

.button:hover:not(:disabled) {
  background: rgba(0, 255, 65, 0.1);
  box-shadow: 0 0 10px var(--green);
}

.button:disabled {
  opacity: 0.3;
  cursor: default;
}

.info {
  font-size: 0.9rem;
  color: var(--green3);
  max-width: 400px;
}
</style>
</head>
<body>

<h1>ARCH</h1>

<div class="box">
  <div class="status" id="status">⏳ Chargement...</div>
</div>

<div class="box">
  <div class="balance" id="balance">◈ 0.000000 ARCH</div>
</div>

<button class="button" id="testBtn" disabled>Test WebSocket</button>

<div class="info" id="info"></div>

<script>
// ============================================================
//  CONFIG & UTILS
// ============================================================
const CLIENT_ID = '__DISCORD_CLIENT_ID__';
const SERVER_URL = '__SERVER_URL__';

console.log('🔍 CLIENT_ID:', CLIENT_ID);
console.log('🔍 SERVER_URL:', SERVER_URL);

let serverUrl = SERVER_URL;
if (!serverUrl || serverUrl === '__SERVER_URL__') {
  serverUrl = location.origin;
} else {
  console.log('✅ SERVER_URL injecté:', serverUrl);
}

let token = null;
let balance = 0;
let ws = null;

function setStatus(msg) {
  document.getElementById('status').textContent = msg;
}

function setBalance(val) {
  balance = val;
  document.getElementById('balance').textContent = '◈ ' + val.toFixed(6) + ' ARCH';
}

function setInfo(msg) {
  document.getElementById('info').textContent = msg;
}

// ============================================================
//  DISCORD SDK VIA IIFE (Immediately Invoked Function Expression)
// ============================================================
const initDiscordSDK = () => {
  return new Promise(async (resolve, reject) => {
    try {
      // Charger le SDK dynamiquement
      const script = document.createElement('script');
      script.src = 'https://cdn.jsdelivr.net/npm/@discord/embedded-app-sdk@1.3.0';
      
      script.onload = async () => {
        try {
          // Le SDK est maintenant disponible globalement
          if (!window.DiscordSDK) {
            throw new Error('DiscordSDK not available on window');
          }
          
          console.log('✅ Discord SDK chargé');
          
          const discordSdk = new window.DiscordSDK(CLIENT_ID);
          console.log('✅ DiscordSDK instancié');
          
          // Ready
          await discordSdk.ready();
          console.log('✅ Discord SDK prêt');
          
          // Authorize
          const { code } = await discordSdk.commands.authorize({
            client_id: CLIENT_ID,
            response_type: 'code',
            state: '',
            prompt: 'none',
            scope: ['identify'],
          });
          console.log('✅ Code reçu');
          
          // Token exchange
          const tr = await fetch(serverUrl + '/api/discord/token', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ code }),
          });
          const { access_token } = await tr.json();
          console.log('✅ Access token reçu');
          
          // Authenticate
          const auth = await discordSdk.commands.authenticate({ access_token });
          console.log('✅ Authentifié:', auth.user.username);
          
          // Créer compte ARCH
          const ar = await fetch(serverUrl + '/api/discord/auth', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              discord_id: auth.user.id,
              username: auth.user.username,
              avatar: auth.user.avatar
            }),
          });
          
          const ad = await ar.json();
          if (!ad.token) throw new Error('Pas de token ARCH');
          
          token = ad.token;
          balance = ad.balance || 0;
          console.log('✅ Compte ARCH créé');
          
          resolve(true);
        } catch(e) {
          console.error('❌ Erreur SDK:', e);
          reject(e);
        }
      };
      
      script.onerror = () => {
        reject(new Error('Erreur chargement SDK'));
      };
      
      document.head.appendChild(script);
      
    } catch(e) {
      reject(e);
    }
  });
};

// ============================================================
//  WEBSOCKET
// ============================================================
async function connectWS() {
  return new Promise((resolve) => {
    try {
      let wsUrl = serverUrl;
      if (!wsUrl.startsWith('http')) {
        wsUrl = location.protocol + '//' + wsUrl;
      }
      wsUrl = wsUrl.replace(/^http:/, 'ws:').replace(/^https:/, 'wss:');
      wsUrl = wsUrl + '/ws?token=' + token;
      
      console.log('🔌 WebSocket:', wsUrl);
      
      ws = new WebSocket(wsUrl);
      
      ws.onopen = () => {
        console.log('✅ WebSocket connecté');
        resolve();
      };
      
      ws.onerror = (err) => {
        console.error('❌ WebSocket erreur:', err);
        resolve();
      };
      
      ws.onmessage = (e) => {
        const msg = JSON.parse(e.data);
        if (msg.type === 'balance_sync') {
          setBalance(msg.balance);
        }
      };
      
      ws.onclose = () => {
        console.log('⚠️ WebSocket fermé');
        setTimeout(connectWS, 3000);
      };
      
      setTimeout(resolve, 2000);
    } catch(e) {
      console.error('Erreur WS:', e);
      resolve();
    }
  });
}

// ============================================================
//  MAIN
// ============================================================
async function init() {
  try {
    setStatus('🔐 Discord SDK...');
    await initDiscordSDK();
    
    setStatus('🔌 WebSocket...');
    await connectWS();
    
    setStatus('✅ Connecté!');
    setBalance(balance);
    setInfo('Discord Activity avec SDK fonctionne!');
    document.getElementById('testBtn').disabled = false;
    
  } catch(e) {
    console.error('❌ Erreur:', e);
    setStatus('❌ ' + e.message);
    setInfo('Vérifies la console pour plus de détails');
  }
}

// Démarrer
window.addEventListener('load', init);

// Test button
document.getElementById('testBtn').addEventListener('click', () => {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'status', status: 'playing' }));
    setInfo('✅ Message envoyé');
  } else {
    setInfo('❌ WebSocket pas connecté');
  }
});
</script>
</body>
</html>
