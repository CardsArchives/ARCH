<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARCH Activity</title>
<style>
:root {
  --green: #00ff41;
  --green3: #008f11;
  --red: #ff003c;
  --gold: #ffe066;
  --font: 'Courier New', Courier, monospace;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  height: 100%;
  background: #000;
  color: var(--green);
  font-family: var(--font);
  overflow: hidden;
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 20px;
  padding: 20px;
  min-height: 100vh;
}

#app {
  text-align: center;
  display: flex;
  flex-direction: column;
  gap: 20px;
  align-items: center;
}

h1 {
  font-size: 3rem;
  letter-spacing: 10px;
  text-shadow: 0 0 20px var(--green);
}

.box {
  border: 1px solid var(--green3);
  padding: 15px 30px;
  min-width: 300px;
}

.status {
  font-size: 1rem;
  color: var(--green);
}

.balance {
  font-size: 1.3rem;
  color: var(--gold);
  font-weight: bold;
}

.button {
  background: transparent;
  border: 1px solid var(--green);
  color: var(--green);
  font-family: var(--font);
  font-size: 0.9rem;
  padding: 10px 25px;
  cursor: pointer;
  margin-top: 10px;
}

.button:hover:not(:disabled) {
  background: rgba(0, 255, 65, 0.1);
  box-shadow: 0 0 10px var(--green);
}

.button:disabled {
  opacity: 0.3;
}

.info {
  font-size: 0.8rem;
  color: var(--green3);
  max-width: 400px;
}
</style>
</head>
<body>

<div id="app">
  <h1>ARCH</h1>
  
  <div class="box">
    <div class="status" id="status">⏳ Chargement...</div>
  </div>
  
  <div class="box">
    <div class="balance" id="balance">◈ 0.000000 ARCH</div>
  </div>
  
  <button class="button" id="testBtn" disabled>Test</button>
  
  <div class="info" id="info"></div>
</div>

<script>
const CLIENT_ID = '__DISCORD_CLIENT_ID__';
const SERVER_URL = '__SERVER_URL__';

console.log('🔍 CLIENT_ID:', CLIENT_ID);
console.log('🔍 SERVER_URL:', SERVER_URL);

let serverUrl = SERVER_URL;
if (!serverUrl || serverUrl === '__SERVER_URL__') {
  serverUrl = location.origin;
}

let token = null;
let balance = 0;
let ws = null;

function setStatus(msg) {
  document.getElementById('status').textContent = msg;
}

function setBalance(val) {
  balance = val;
  document.getElementById('balance').textContent = '◈ ' + val.toFixed(6) + ' ARCH';
}

function setInfo(msg) {
  document.getElementById('info').textContent = msg;
}

// Create anonymous account
async function init() {
  try {
    setStatus('📝 Création compte...');
    
    const userId = 'activity_' + Math.random().toString(36).substring(7);
    const userName = 'Player' + Math.floor(Math.random() * 10000);
    
    const res = await fetch(serverUrl + '/api/discord/auth', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        discord_id: userId,
        username: userName,
        avatar: null
      }),
    });
    
    const data = await res.json();
    if (!data.token) throw new Error('Pas de token');
    
    token = data.token;
    balance = data.balance || 0;
    console.log('✅ Compte créé:', userName);
    
    // Connect WebSocket
    setStatus('🔌 Connexion...');
    
    let wsUrl = serverUrl;
    if (!wsUrl.startsWith('http')) wsUrl = location.protocol + '//' + wsUrl;
    wsUrl = wsUrl.replace(/^http:/, 'ws:').replace(/^https:/, 'wss:');
    wsUrl = wsUrl + '/ws?token=' + token;
    
    ws = new WebSocket(wsUrl);
    
    ws.onopen = () => {
      console.log('✅ WebSocket connecté');
      setStatus('✅ Connecté!');
      setBalance(balance);
      setInfo('Discord Activity fonctionne!');
      document.getElementById('testBtn').disabled = false;
    };
    
    ws.onerror = () => {
      setStatus('⚠️ Pas de WebSocket');
      setBalance(balance);
      setInfo('Mode lecture seule');
    };
    
    ws.onmessage = (e) => {
      const msg = JSON.parse(e.data);
      if (msg.type === 'balance_sync') setBalance(msg.balance);
    };
    
    ws.onclose = () => {
      setTimeout(init, 3000);
    };
    
  } catch(e) {
    console.error('❌ Erreur:', e);
    setStatus('❌ Erreur');
    setInfo(e.message);
  }
}

init();

document.getElementById('testBtn').addEventListener('click', () => {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'status', status: 'playing' }));
    setInfo('✅ Message envoyé');
  }
});
</script>
</body>
</html>
