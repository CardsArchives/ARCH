<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARCH Activity</title>
<style>
:root {
  --green: #00ff41;
  --green3: #008f11;
  --green4: #003b00;
  --red: #ff003c;
  --gold: #ffe066;
  --font: 'Courier New', Courier, monospace;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  height: 100%;
  background: #000;
  color: var(--green);
  font-family: var(--font);
  overflow: hidden;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 20px;
  padding: 20px;
}

h1 {
  font-size: 3rem;
  letter-spacing: 10px;
  text-shadow: 0 0 20px var(--green);
}

.box {
  border: 1px solid var(--green3);
  padding: 15px 30px;
  text-align: center;
  min-width: 300px;
}

.status {
  font-size: 1.1rem;
  color: var(--green);
  font-weight: bold;
}

.balance {
  font-size: 1.3rem;
  color: var(--gold);
  font-weight: bold;
}

.button {
  background: transparent;
  border: 1px solid var(--green);
  color: var(--green);
  font-family: var(--font);
  font-size: 0.9rem;
  padding: 10px 25px;
  cursor: pointer;
  margin-top: 10px;
}

.button:hover:not(:disabled) {
  background: rgba(0, 255, 65, 0.1);
  box-shadow: 0 0 10px var(--green);
}

.button:disabled {
  opacity: 0.3;
  cursor: default;
}

.error {
  color: var(--red);
}

.info {
  font-size: 0.9rem;
  color: var(--green3);
  max-width: 400px;
}
</style>
</head>
<body>

<h1>ARCH</h1>

<div class="box">
  <div class="status" id="status">⏳ Chargement...</div>
</div>

<div class="box">
  <div class="balance" id="balance">◈ 0.000000 ARCH</div>
</div>

<button class="button" id="testBtn" disabled>Test WebSocket</button>

<div class="info" id="info"></div>

<script>
// ============================================================
//  CONFIG
// ============================================================
const CLIENT_ID = '__DISCORD_CLIENT_ID__';
const SERVER_URL = '__SERVER_URL__';

console.log('🔍 CLIENT_ID:', CLIENT_ID);
console.log('🔍 SERVER_URL:', SERVER_URL);

// Déterminer l'URL du serveur
let serverUrl = SERVER_URL;
if (!serverUrl || serverUrl === '__SERVER_URL__') {
  serverUrl = location.origin;
  console.log('⚠️ SERVER_URL pas injecté, utilisant location.origin:', serverUrl);
} else {
  console.log('✅ SERVER_URL injecté:', serverUrl);
}

// ============================================================
//  STATE
// ============================================================
let token = null;
let balance = 0;
let ws = null;

// ============================================================
//  UTILS
// ============================================================
function setStatus(msg) {
  document.getElementById('status').textContent = msg;
}

function setBalance(val) {
  balance = val;
  document.getElementById('balance').textContent = '◈ ' + val.toFixed(6) + ' ARCH';
}

function setInfo(msg) {
  document.getElementById('info').textContent = msg;
}

// ============================================================
//  CREATE ANONYMOUS ARCH ACCOUNT
// ============================================================
async function createAccount() {
  try {
    setStatus('📝 Création compte...');
    
    // Créer un utilisateur anonyme
    const userId = 'user_' + Math.random().toString(36).substring(7);
    const userName = 'Player' + Math.floor(Math.random() * 10000);
    
    const res = await fetch(serverUrl + '/api/discord/auth', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        discord_id: userId,
        username: userName,
        avatar: null
      }),
    });
    
    const data = await res.json();
    console.log('Réponse serveur:', data);
    
    if (!data.token) {
      throw new Error('Pas de token reçu');
    }
    
    token = data.token;
    balance = data.balance || 0;
    
    console.log('✅ Compte créé:', userName);
    return true;
    
  } catch(e) {
    console.error('❌ Erreur création compte:', e);
    setStatus('❌ Erreur: ' + e.message);
    return false;
  }
}

// ============================================================
//  WEBSOCKET
// ============================================================
async function connectWS() {
  return new Promise((resolve) => {
    try {
      let wsUrl = serverUrl;
      
      if (!wsUrl.startsWith('http')) {
        wsUrl = location.protocol + '//' + wsUrl;
      }
      
      wsUrl = wsUrl.replace(/^http:/, 'ws:').replace(/^https:/, 'wss:');
      wsUrl = wsUrl + '/ws?token=' + token;
      
      console.log('🔌 Connexion WebSocket:', wsUrl);
      
      ws = new WebSocket(wsUrl);
      
      ws.onopen = () => {
        console.log('✅ WebSocket connecté');
        resolve();
      };
      
      ws.onerror = (err) => {
        console.error('❌ WebSocket erreur:', err);
        resolve();
      };
      
      ws.onmessage = (e) => {
        const msg = JSON.parse(e.data);
        if (msg.type === 'balance_sync') {
          setBalance(msg.balance);
        }
      };
      
      ws.onclose = () => {
        console.log('⚠️ WebSocket fermé, reconnexion...');
        setTimeout(connectWS, 3000);
      };
      
      setTimeout(resolve, 2000);
    } catch(e) {
      console.error('Erreur WebSocket:', e);
      resolve();
    }
  });
}

// ============================================================
//  MAIN
// ============================================================
async function init() {
  try {
    const ok = await createAccount();
    
    if (!ok) return;
    
    setStatus('🔌 Connexion WebSocket...');
    await connectWS();
    
    setStatus('✅ Connecté!');
    setBalance(balance);
    setInfo('Discord Activity fonctionne!');
    document.getElementById('testBtn').disabled = false;
    
  } catch(e) {
    console.error('Erreur:', e);
    setStatus('❌ ' + e.message);
  }
}

// Démarrer
init();

// Test button
document.getElementById('testBtn').addEventListener('click', () => {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'status', status: 'playing' }));
    setInfo('✅ Message envoyé au serveur');
  } else {
    setInfo('❌ WebSocket pas connecté');
  }
});
</script>
</body>
</html>
