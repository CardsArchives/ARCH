<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARCH Activity</title>
<style>
:root {
  --green: #00ff41;
  --green3: #008f11;
  --green4: #003b00;
  --red: #ff003c;
  --gold: #ffe066;
  --font: 'Courier New', Courier, monospace;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  height: 100%;
  background: #000;
  color: var(--green);
  font-family: var(--font);
  overflow: hidden;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

#app {
  text-align: center;
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 20px;
  padding: 20px;
}

h1 {
  font-size: 3rem;
  letter-spacing: 10px;
  text-shadow: 0 0 20px var(--green);
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.6; }
}

.status {
  font-size: 1rem;
  letter-spacing: 2px;
  color: var(--green3);
  min-height: 30px;
}

.status.loading {
  color: var(--green);
}

.status.error {
  color: var(--red);
}

.status.success {
  color: var(--gold);
}

.balance {
  font-size: 1.2rem;
  color: var(--gold);
  border: 1px solid var(--green3);
  padding: 10px 20px;
  border-radius: 4px;
  min-width: 200px;
}

.button {
  background: transparent;
  border: 1px solid var(--green);
  color: var(--green);
  font-family: var(--font);
  font-size: 0.9rem;
  padding: 10px 20px;
  cursor: pointer;
  transition: all 0.2s;
}

.button:hover:not(:disabled) {
  background: rgba(0, 255, 65, 0.1);
  box-shadow: 0 0 10px var(--green);
}

.button:disabled {
  opacity: 0.3;
  cursor: default;
}

.info {
  font-size: 0.8rem;
  color: var(--green3);
  max-width: 400px;
  line-height: 1.5;
}
</style>
</head>
<body>

<div id="app">
  <h1>ARCH</h1>
  <div class="status loading" id="status">⏳ Initialisation...</div>
  <div class="balance" id="balance">◈ 0.000000 ARCH</div>
  <button class="button" id="testBtn" disabled>Test</button>
  <div class="info" id="info"></div>
</div>

<script>
// ============================================================
//  CONFIG
// ============================================================
const CLIENT_ID = '__DISCORD_CLIENT_ID__';
const SERVER_URL = '__SERVER_URL__';

console.log('🔍 CLIENT_ID:', CLIENT_ID);
console.log('🔍 SERVER_URL:', SERVER_URL);

// Déterminer l'URL du serveur
let serverUrl = SERVER_URL;
if (!serverUrl || serverUrl === '__SERVER_URL__') {
  serverUrl = location.origin;
  console.log('⚠️ SERVER_URL pas injecté, utilisant location.origin:', serverUrl);
} else {
  console.log('✅ SERVER_URL injecté:', serverUrl);
}

// ============================================================
//  STATE
// ============================================================
let myUser = null;
let token = null;
let balance = 0;
let ws = null;

// ============================================================
//  UTILS
// ============================================================
function setStatus(msg, type = 'loading') {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = 'status ' + type;
}

function setBalance(val) {
  balance = val;
  document.getElementById('balance').textContent = '◈ ' + val.toFixed(6) + ' ARCH';
}

function setInfo(msg) {
  document.getElementById('info').textContent = msg;
}

// ============================================================
//  DISCORD OAUTH2 (sans SDK, juste fetch)
// ============================================================
async function getDiscordUser() {
  try {
    setStatus('🔐 Récupération du code...', 'loading');
    
    // En Discord Activity, on est déjà authentifié via le context
    // On peut directement appeler notre API
    console.log('✅ Authentification Discord Activity directe');
    
    // Simulation d'un utilisateur Discord (en prod, Discord injecte ça)
    // Pour maintenant, on skip l'auth Discord et on va directement au serveur
    return { 
      id: Math.random().toString(36).substring(7),
      username: 'DiscordUser' + Math.floor(Math.random() * 10000),
      avatar: null
    };
  } catch(e) {
    console.error('Erreur Discord:', e);
    throw e;
  }
}

// ============================================================
//  MAIN
// ============================================================
async function init() {
  try {
    setStatus('🔐 Authentification...', 'loading');
    
    // 1. Récupérer l'utilisateur Discord
    myUser = await getDiscordUser();
    console.log('✅ Utilisateur Discord:', myUser.username);
    
    // 2. Créer/récupérer le compte ARCH
    setStatus('📝 Création compte ARCH...', 'loading');
    const ar = await fetch(serverUrl + '/api/discord/auth', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        discord_id: myUser.id,
        username: myUser.username,
        avatar: myUser.avatar
      }),
    });
    
    const ad = await ar.json();
    console.log('Réponse serveur:', ad);
    
    if (!ad.token) {
      throw new Error('Compte non créé: ' + JSON.stringify(ad));
    }
    
    token = ad.token;
    balance = ad.balance || 0;
    console.log('✅ Compte ARCH:', ad.username);
    
    // 3. Connecter WebSocket
    setStatus('🔌 Connexion WebSocket...', 'loading');
    await connectWS();
    
    // 4. Succès!
    setStatus('✅ Connecté!', 'success');
    setBalance(balance);
    setInfo('Discord Activity est connectée et fonctionne!');
    document.getElementById('testBtn').disabled = false;
    
  } catch(e) {
    console.error('❌ Erreur:', e);
    setStatus('❌ Erreur: ' + e.message, 'error');
    setInfo(e.message);
  }
}

// ============================================================
//  WEBSOCKET
// ============================================================
async function connectWS() {
  return new Promise((resolve) => {
    let wsUrl = serverUrl;
    
    // S'assurer que wsUrl commence par http:// ou https://
    if (!wsUrl.startsWith('http')) {
      wsUrl = location.protocol + '//' + wsUrl;
    }
    
    // Convertir http en ws, https en wss
    wsUrl = wsUrl.replace(/^http:/, 'ws:').replace(/^https:/, 'wss:');
    wsUrl = wsUrl + '/ws?token=' + token;
    
    console.log('🔌 WebSocket URL:', wsUrl);
    
    ws = new WebSocket(wsUrl);
    
    ws.onopen = () => {
      console.log('✅ WebSocket connecté');
      resolve();
    };
    
    ws.onerror = (err) => {
      console.error('❌ WebSocket erreur:', err);
      resolve();
    };
    
    ws.onmessage = (e) => {
      try {
        const msg = JSON.parse(e.data);
        if (msg.type === 'balance_sync') {
          setBalance(msg.balance);
        }
      } catch(e) {
        console.error('Erreur parse:', e);
      }
    };
    
    ws.onclose = () => {
      console.log('⚠️ WebSocket fermé');
      setTimeout(connectWS, 3000);
    };
    
    setTimeout(resolve, 2000);
  });
}

// ============================================================
//  STARTUP
// ============================================================
init();

// Test button
document.getElementById('testBtn').addEventListener('click', () => {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'status', status: 'playing' }));
    setInfo('Message envoyé au serveur');
  }
});
</script>
</body>
</html>
