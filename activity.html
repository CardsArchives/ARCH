<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ARCH</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; background: #000; overflow: hidden; font-family: 'Courier New', monospace; color: #00ff41; }
#boot { position: fixed; inset: 0; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; gap: 18px; }
.boot-logo { font-size: clamp(2rem, 10vw, 3.5rem); font-weight: 900; letter-spacing: 14px; text-shadow: 0 0 10px #00ff41, 0 0 30px #00ff41; animation: pulse 2s ease-in-out infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.7} }
.boot-status { font-size: 0.62rem; letter-spacing: 4px; color: #008f11; min-height: 1.2em; text-align: center; }
.boot-bar-wrap { width: min(260px, 80vw); height: 2px; background: #003b00; }
.boot-bar { height: 100%; background: #00ff41; width: 0%; transition: width 0.4s ease; box-shadow: 0 0 8px #00ff41; }
.boot-err { font-size: 0.58rem; color: #ff003c; letter-spacing: 1px; text-align: center; display: none; max-width: 94vw; line-height: 1.8; padding: 0 16px; word-break: break-word; }
#gameFrame { width: 100%; height: 100%; border: none; display: none; }
</style>
</head>
<body>
<div id="boot">
  <div class="boot-logo">ARCH</div>
  <div class="boot-bar-wrap"><div class="boot-bar" id="bootBar"></div></div>
  <div class="boot-status" id="bootStatus">INITIALISATION...</div>
  <div class="boot-err" id="bootErr"></div>
</div>
<iframe id="gameFrame" src="" allow="autoplay; clipboard-write"></iframe>

<script type="module">
import { DiscordSDK } from 'https://cdn.jsdelivr.net/npm/@discord/embedded-app-sdk@1.3.0/output/index.mjs';

const CLIENT_ID = '__DISCORD_CLIENT_ID__';
const statusEl  = document.getElementById('bootStatus');
const barEl     = document.getElementById('bootBar');
const errEl     = document.getElementById('bootErr');
const bootEl    = document.getElementById('boot');
const frameEl   = document.getElementById('gameFrame');

function setProgress(pct, msg) {
  barEl.style.width = pct + '%';
  if (msg) statusEl.textContent = msg;
}
function showError(msg) {
  errEl.innerHTML = String(msg).replace(/\n/g, '<br>');
  errEl.style.display = 'block';
  statusEl.textContent = 'ERREUR';
  barEl.style.background = '#ff003c';
}

async function init() {
  try {
    const params     = new URLSearchParams(window.location.search);
    const frameId    = params.get('frame_id')    || undefined;
    const instanceId = params.get('instance_id') || undefined;
    const guildId    = params.get('guild_id')    || undefined;
    const channelId  = params.get('channel_id')  || undefined;

    setProgress(20, 'CONNEXION DISCORD...');
    const sdk = new DiscordSDK(CLIENT_ID, { frameId, instanceId });
    await sdk.ready();
    setProgress(40, 'SDK PRET');

    // Authorize via SDK — récupère le code
    setProgress(50, 'AUTORISATION...');
    let code;
    try {
      const result = await sdk.commands.authorize({
        client_id: CLIENT_ID,
        response_type: 'code',
        state: '',
        prompt: 'none',
        scope: ['identify'],
      });
      code = result.code;
    } catch(authErr) {
      // Si authorize échoue à cause de l'URL, on utilise le discord_proxy_ticket
      // comme fallback identifiant (instance_id contient l'user ID encodé)
      console.warn('authorize failed, using fallback:', authErr.message);
      // Fallback : utilise instance_id + guild + channel comme identité unique
      const fallbackId = instanceId || frameId || Date.now().toString();
      const res2 = await fetch('/api/discord/login-fallback', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ instance_id: fallbackId, guild_id: guildId, channel_id: channelId }),
      });
      const arch = await res2.json();
      if (!res2.ok || !arch.token) throw new Error('Fallback auth: ' + (arch.error || JSON.stringify(arch)));
      setProgress(90, 'BONJOUR ' + (arch.discord_name || arch.username).toUpperCase());
      await finalize(arch);
      return;
    }

    if (!code) throw new Error('Code manquant');
    setProgress(65, 'CODE RECU');

    // Envoie le code au serveur qui fait tout côté Node
    setProgress(75, 'COMPTE ARCH...');
    const res2 = await fetch('/api/discord/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code }),
    });
    const arch = await res2.json();
    if (!res2.ok || !arch.token) throw new Error('Login: ' + (arch.error || JSON.stringify(arch)));
    setProgress(90, 'BONJOUR ' + (arch.discord_name || arch.username).toUpperCase());
    await finalize(arch);

  } catch (err) {
    console.error('[ARCH Activity]', err);
    showError((err && (err.message || err.error || JSON.stringify(err))) || 'Erreur inconnue');
  }
}

async function finalize(arch) {
  sessionStorage.setItem('arch_token',          arch.token);
  sessionStorage.setItem('arch_username',       arch.username);
  sessionStorage.setItem('arch_balance',        arch.balance);
  sessionStorage.setItem('discord_name',        arch.discord_name  || arch.username);
  sessionStorage.setItem('discord_avatar',      arch.discord_avatar || '');
  sessionStorage.setItem('is_discord_activity', '1');

  setProgress(100, 'LANCEMENT...');
  await new Promise(r => setTimeout(r, 300));
  document.getElementById('gameFrame').src = '/hub.html';
  document.getElementById('gameFrame').style.display = 'block';
  document.getElementById('boot').style.display = 'none';
}

init();
</script>
</body>
</html>
